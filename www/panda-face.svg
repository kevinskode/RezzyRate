<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 16 200 116" role="img" aria-label="Rezzy the panda" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Rezzy face: small-size version of panda.svg -->
  <defs>
    <style>
      .dk{fill:#2E2380}
      .fur{fill:#F7F5FF}
      .edge{fill:none;stroke:#DCD5FB;stroke-width:2}
    </style>
  </defs>

  <!-- ears -->
  <circle class="dk" cx="56" cy="38" r="18"/>
  <circle class="dk" cx="144" cy="38" r="18"/>
  <circle cx="56" cy="38" r="8.5" fill="#7A68EA"/>
  <circle cx="144" cy="38" r="8.5" fill="#7A68EA"/>

  <!-- pencil tucked by the ear -->
  <g transform="rotate(38 150 62)">
    <rect x="144" y="34" width="11" height="40" rx="2" fill="#FF7A59"/>
    <rect x="144" y="34" width="11" height="7" rx="2" fill="#F6C7D8"/>
    <rect x="144" y="40" width="11" height="3" fill="#C9BFFA"/>
    <path d="M144 74h11l-5.5 10z" fill="#FFE2C7"/>
    <path d="M147.8 81h3.4l-1.7 3z" fill="#2E2380"/>
  </g>

  <!-- head -->
  <ellipse class="fur" cx="100" cy="80" rx="58" ry="50"/>
  <ellipse class="edge" cx="100" cy="80" rx="58" ry="50"/>

  <!-- eye patches (tilted out and down for a soft, friendly look) -->
  <ellipse class="dk" cx="77" cy="86" rx="14" ry="17" transform="rotate(24 77 86)"/>
  <ellipse class="dk" cx="123" cy="86" rx="14" ry="17" transform="rotate(-24 123 86)"/>

  <!-- big shiny eyes -->
  <circle cx="79" cy="84" r="8" fill="#120C3A"/>
  <circle cx="121" cy="84" r="8" fill="#120C3A"/>
  <circle cx="82" cy="80.5" r="3.4" fill="#FFFFFF"/>
  <circle cx="124" cy="80.5" r="3.4" fill="#FFFFFF"/>
  <circle cx="76.5" cy="87.5" r="1.6" fill="#FFFFFF" opacity=".9"/>
  <circle cx="118.5" cy="87.5" r="1.6" fill="#FFFFFF" opacity=".9"/>

  <!-- round glasses -->
  <g fill="none" stroke="#5B47E0" stroke-width="3.4" stroke-linecap="round">
    <circle cx="79" cy="84" r="17" fill="#FFFFFF" fill-opacity=".14"/>
    <circle cx="121" cy="84" r="17" fill="#FFFFFF" fill-opacity=".14"/>
    <path d="M96 82c2.5-3 5.5-3 8 0"/>
    <path d="M62 80l-18-5"/>
    <path d="M138 80l18-5"/>
  </g>
  <path d="M68 75c2-3 5-5 8-5.5" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" opacity=".85"/>
  <path d="M110 75c2-3 5-5 8-5.5" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" opacity=".85"/>

  <!-- blush -->
  <ellipse cx="62" cy="108" rx="8" ry="5" fill="#FFB3C7" opacity=".55"/>
  <ellipse cx="138" cy="108" rx="8" ry="5" fill="#FFB3C7" opacity=".55"/>

  <!-- nose & smile -->
  <path class="dk" d="M94.5 103h11c1.8 0 2.6 1.9 1.4 3.2l-4.4 4.2c-1.4 1.3-3.6 1.3-5 0l-4.4-4.2c-1.2-1.3-.4-3.2 1.4-3.2z"/>
  <path d="M93 114c2.2 2.8 5 2.8 7 0c2 2.8 4.8 2.8 7 0" fill="none" stroke="#2E2380" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
